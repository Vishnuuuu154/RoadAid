spring.application.name=backend
management.health.mail.enabled=false
# Database
# On Railway these come from the MySQL service variables.
# Locally they fall back to your own MySQL (change the defaults below).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/roadaid?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (must be at least 32 characters)
jwt.secret=${JWT_SECRET}

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Resend Email API
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# CORS (comma-separated list of allowed frontend origins)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator (health check)
management.endpoints.web.exposure.include=health

# Server
server.port=${PORT:8080}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB